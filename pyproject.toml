[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-codex-orchestrator"
version = "0.1.0"
description = "Codex fork of the Hybrid Cloud-Edge AI Orchestrator: Codex CLI Cloud Architect + On-Device Gemma Workforce"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
antigravity-codex-orchestrator = "antigravity_hybrid_orchestrator.cli:main"
codex-orchestrator = "antigravity_hybrid_orchestrator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
